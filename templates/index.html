<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <h1>Todo List</h1>

    <form action="/add" method="POST">
        <input type="text" name="task_description" placeholder="Enter a new task" required>
        <select name="priority" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
        <button class="add" type="submit">Add Task</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            <span class="task {{ task.priority|lower }}">{{ task.task_description }} ({{ task.priority }})</span>
            <form action="/delete/{{ task.task_id }}" method="POST" style="display:inline;">
                <button class="delete" type="submit">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
