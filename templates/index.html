<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
</head>
<body>

  <h1>Todo List</h1>

  <form action="/add" method="POST">
    <input type="text" name="task_description" placeholder="Enter a new task" required>
    <button type="submit">Add Task</button>
  </form>

  <ul>
        {% for task in tasks %}
        <li>{{ task.task_description }}
            <form action="/delete/{{ task.task_id }}" method="POST" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
